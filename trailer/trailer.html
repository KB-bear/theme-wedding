<!doctype html>
<html lang="en">
<head>
<base href="/">
<meta charset="utf-8">
<title>Theme Wedding Trailer</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* the trailer shows the world only: no HUD, feed, panels or faxes */
  #hud, #feed, #topinfo, #toasts, #side, #info, #tip, #placebar, #advisor, #modal { display: none !important; }
  #ov { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="ov"></canvas>
<div id="topinfo"></div>
<div id="feed"></div>
<div id="toasts"></div>
<div id="side" class="panel hidden"></div>
<div id="info" class="panel hidden"></div>
<div id="tip"></div>
<div id="placebar" class="hidden"></div>
<div id="advisor" class="hidden"><canvas width="160" height="160"></canvas><div class="say"></div></div>
<div id="hud">
  <div class="hb clock"><div id="hClock">09:30</div><div id="hPhase" class="small">Setting Up</div></div>
  <div class="hb"><div class="lbl">BUDGET</div><div id="hMoney" class="big">£5,000</div></div>
  <div class="hb speed"><button data-speed="0">II</button><button data-speed="1">&gt;</button><button data-speed="2">&gt;&gt;</button><button data-speed="3">&gt;&gt;&gt;</button></div>
  <button id="bBuild" class="hbtn">FURNISH</button><button id="bHire" class="hbtn">HIRE</button><button id="bBar" class="hbtn">BAR: CASH</button>
  <div class="hb"><div class="lbl">GUESTS <span id="hGuests">0</span> · MOOD</div><div class="meter"><i id="hHappy"></i></div></div>
  <div class="hb"><div class="lbl">BLISS</div><div id="hBliss" class="hearts"></div></div>
  <div class="hb"><div class="lbl">JOY</div><div id="hJoy" class="big gold">0</div></div>
  <button id="bMusic" class="hbtn">MUSIC</button><button id="bSfx" class="hbtn">SFX</button><button id="bHelp" class="hbtn">?</button>
</div>
<div id="modal" class="hidden"><div id="mbox"></div></div>

<script>
// ---- deterministic world: seeded random, no real-time loop, offline audio ----
(function () {
  try { localStorage.clear(); localStorage.setItem('tw_music', 'true'); localStorage.setItem('tw_sfx', 'true'); } catch (e) {}
  let s = (+(new URLSearchParams(location.search).get('seed')) || 20261011) >>> 0;
  Math.random = function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  window.requestAnimationFrame = function () { return 0; }; // the trailer drives every frame itself
  window.TRA = { vt: 0, off: null };
  window.AudioContext = window.webkitAudioContext = function () {
    const off = TRA.off;
    return {
      get currentTime() { return TRA.vt; }, get sampleRate() { return off.sampleRate; }, get destination() { return off.destination; },
      state: 'running', resume() {},
      createGain: () => off.createGain(), createOscillator: () => off.createOscillator(), createBiquadFilter: () => off.createBiquadFilter(),
      createBuffer: (a, b, c) => off.createBuffer(a, b, c), createBufferSource: () => off.createBufferSource(),
    };
  };
})();
</script>
<script src="guest-names.js"></script>
<script src="js/i18n.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="assets/characters/index.js"></script>
<script src="assets/characters/faces.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sim.js"></script>
<script src="js/events.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="trailer/director.js"></script>
</body>
</html>
